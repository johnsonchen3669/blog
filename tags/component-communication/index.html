rds 與 lazy loading。 angular-training angular angular-training routing route-guard lazy-loading 今天會介紹一些昨天沒提到的路由功能，像是路由設定屬性、路由守衛以及延遲加載路由等功能 路由設定屬性 ： 通配符路由，用來匹配所有未定義的路由，通常用於顯示 404 頁面。 ：用來將某個路由重定向到另一個路由。 ：用來指定路徑匹配的策略 ：表示路徑必須完全匹配，才會觸發重定向。 ：表示只要路徑是以指定的字串開頭，就會觸發重定向。 路由也可以夾帶 屬性，來傳遞靜態資料給元件。 ：用來在路由切換前預先取得資料，確保元件在載入時已經有需要的資料。 是提供用來定義路由 resolver 的型別。它讓你可以在進入路由前，先取得或處理資料，並將結果注入到對應的元件。 ：代表即將被啟用的路由，用來取得該層路由的路由參數、查詢參數、靜態資料等。 ：可以取得目前整體的路由狀態，包括所有巢狀路由的資訊 :可以更換頁面標題 除了靜態設定外，也可以動態更改，可以傳入自定義的resolvefn， activatedroute 用來取得當前路由的資訊，例如路由參數、查詢參數等。 snapshot：用來同步取得當前路由的資訊，缺點是無法即時反映路由變化。適合在元件初始化時使用且不需要監聽路由變化的情境。 透過 activatedroute 也可以在元件內訂閱 data 屬性來取得靜態資料或解析後的資料，這樣可以即時根據路由變化更新資料。 roate guard 路由守衛用來控制路由的存取權限，確保只有符合條件的使用者才能進入特定的路由。 ：進入路由前，判斷是否允許進入某個路由。常用於登入驗證或權限檢查 ：進入子路由前，判斷是否允許進入某個路由的子路由。通常用於有巢狀子路由時，統一檢查權限 ：離開路由前，判斷是否允許離開當前路由。常用於表單未儲存時提醒使用者。 判斷路由是否符合條件，決定是否要套用該路由。可用於動態路由選擇，比 canactivate 更早執行。 使用 來實作 守衛 ：當前路由的資訊 ：目前 url 被分割後的片段陣列 可透過 建立一個重導指令，用於導航到指定的 url。 預設情況下，只有路由參數才會觸發路由守衛和解析器重新執行，若需要在查詢參數或片段變化時也重新執行，可以使用 選項來設定。 ：用來指定在什麼情況下重新執行路由守衛和解析器 ：只有路由參數變動時才會重新執行（預設）。 ：只有路徑參數變動時才會重新執行。 ：當路由參數或查詢參數改變時重新執行 lazy loading route 讓初始化應用程式時，不會立即載入所有的元件，而是等到使用者導航到相關路由時，才會動態載入對應的元件。會有助於減少初始載入時間，更好用戶體驗。 ：將原本的 component 屬性替換成 loadcomponent 屬性，並提供一個函式來動態載入元件。 ：將原本的 children 屬性替換成 loadchildren 屬性，並提供一個函式來動態載入原本的子路由。 若需讓 service 僅在特定路由 lazy loading 時載入，可直接在該路由的 providers屬性中提供該服務，讓服務的作用域限定於該路由及其子路由。此時不需在 service 上設定 。 結論 今天介紹了路由設定屬性、路由守衛以及延遲加載路由等功能。"},{"title":"Routing （一） | Angular 新手練功日誌","titleLower":"routing （一） | angular 新手練功日誌","url":"/blog/angular-training/routing-basics/","urlLower":"/blog/angular-training/routing-basics/","excerpt":"整理 Angular Routing 的基礎用法，包含路由設定、導航、動態路由與巢狀路由。","searchText":"routing （一） | angular 新手練功日誌 整理 angular routing 的基礎用法，包含路由設定、導航、動態路由與巢狀路由。 angular-training angular angular-training routing router angular 預設是一個單頁應用程式（spa），為了實現不同頁面內容的切換，提供了強大的路由功能。透過路由，使用者可以根據網址（url）的變化，動態顯示不同的元件，就像在多個頁面之間切換一樣，但實際上不需要重新載入整個網頁。這就是 client side routing 的特點。 建立路由 可以在 中透過建立 陣列來定義路由設定，每個路由物件包含以下主要的屬性 ：路由的路徑，對應 u 數，並搭配 使用。 、 、模板參考變數之後會再詳細介紹，這邊先了解語法即可。 沒有內建的 else if。必須用多個 + 或 來模擬多分支條件 必須要注意的是，必須引入 才能使用 指令 獨立元件可只引入 ngif 前綴代表這是一個結構型指令 (structural directive) 的語法糖，會動態新增或移除 dom 元素，在 angular 22 後，ngif 會正式棄用，僅建議在舊專案中使用。 專案製作 今日目標：透過 if 處理 \"未建立任何待辦事項\" 的情況。 建立 todolist 陣列 透過陣列數量判斷是否處於未建立任何待辦事項的情況 day 10 分享 day 10 分享 (舊版) 結論 今天介紹了兩種在 angular 模板中使用條件語句的方法： / 和 搭配 。前者語法更直觀，後者則是舊版的寫法已經不建議在新專案中使用。明天將介紹另一種條件語句 switch。"},{"title":"Signals | Angular 新手練功日誌","titleLower":"signals | angular 新手練功日誌","url":"/blog/angular-training/signals-basics/","urlLower":"/blog/angular-training/signals-basics/","excerpt":"從變更偵測機制切入，整理 Angular Signals 的建立、更新與唯讀、衍生狀態寫法。","searchText":"signals | angular 新手練功日誌 從變更偵測機制切入，整理 angular signals 的建立、更新與唯讀、衍生狀態寫法。 angular-training angular angular-training signals computed 在談到 angular 中的變數新儲存方式 signal 前，需要介紹一下 angular 背後的偵測機制。 目前有兩種主要的變更偵測機制，當資料改變時，會觸發畫面更新： zone.js zoneless 了解 angular 中的偵測機制 zone.js zone.js 是 angular 用來追蹤所有可能改變資料的操作，會在以下各類操作完成後自動觸發變更偵測。 計時器（如 settimeout、setinterval） http 請求（如 ajax、fetch、httpclient） 事件監聽（如 click、keyup 等事件） promise、async/await 但因為每次操作完成後都會觸發變更偵測，可能會導致不必要的重新渲染，並需要依賴額外的 zone.js，在打包上也會增加一些體積。 所以在 angular 16 版本後，提供了另一種選擇 zoneless 的方式來進行變更偵測。而隨著 angular 轉向 zoneless 應用程式開發模式，zone.js 目前也不再接受新功能的開發，僅維持基本的錯誤修正和安全更新。 zoneless zoneless 是指 angular 支援「不依賴 zone.js」的運作模式，是基於 signal 為主的變更偵測機制。angular 不會自動追蹤所有操作，只有當 signal 定義的值改變時，才會觸發畫面更新，減少了不必要的檢查，提升了效能。 signals (angular 16+) signals 是 angular 新推出的響應式狀態管理方式，在定義時需要使用 函數來創建一個信號，並設定初始值。 signals 設定了追蹤機制，可以在其值改變時自動通知相關的元件。 更新方法 signals 提供了兩種主要的更新方法： 和 。 ：純寫入新的值時，使用這方法。 接受一個新的值作為參數，並將其設置為信號的當前值。 ：若新的值是基於當前值進行更新，則使用這方法。 接受一個函數作為參數，該函數接收當前值並返回新的值。 顯示 signal 是「可呼叫的函式」，有別於傳統的變數直接使用變數名稱在模板中顯示，要顯示信號的值時，必須透過呼叫來取值，呼叫時會執行內部的 getter 並回傳 。 唯讀 signal 除了可以寫入外，也可以設定為唯讀 。 透過 方法來創建唯讀版本，這樣可以防止外部修改，只能通過內部的方法來更新。 只用 readonly 屬性修飾，只防止重新指派屬性本身，無法移除物件上的寫入方法，仍然會有 / 等方法可以被呼叫。 衍生狀態 可以使用 函數來創建基於其他信號的衍生值。 同時也是 signals 的一種，同樣透過呼叫 來取信號的值。 當依賴的信號改變時，computed signals 便會自動更新。 過去要達成類似的功能，通常會使用 getter 來實現。但每次訪問值時都會執行計算，即使目標沒有改變，若計算邏輯複雜，可能會導致效能問題。 目前則可以使用 來創建一個新的信號，該信號的值是基於其他信號計算得出的，只有當依賴的信號改變時，才會重新計算。 衍生狀態只能讀取，無法透過 或 來修改。 專案製作 今日目標：練習 signals 的用法。 將 header 元件的 logo 路徑改為 signal 方式來實作。 day 9 分享 結論 今天介紹了 signals 在 angular 中的基本使用方式。明天介紹如何使用條件語句 if 來控制顯示的內容。"},{"title":"事件監聽 | Angular 新手練功日誌","titleLower":"事件監聽 | angular 新手練功日誌","url":"/blog/angular-training/event-listeners/","urlLower":"/blog/angular-training/event-listeners/","excerpt":"介紹 Angular 事件監聽的綁定方式，包含按鍵修飾符、$event 物件與防止預設行為。","searchText":"事件監聽 | angular 新手練功日誌 介紹 angular 事件監聽的綁定方式，包含按鍵修飾符、$event 物件與防止預設行為。 angular-training angular angular-training event-binding template-syntax 今天要來介紹事件監聽，讓使用者可以與應用程式互動。 在 angular 要與應用程式互動，會使用 來綁定事件監聽器，並指定事件觸發時要執行的方法。 按鍵修飾符 key modifiers 監聽鍵盤觸發的事件，還可以繼續取得鍵盤特定鍵，例如： 代表當按下 enter 鍵時觸發事件。 也可以偵測 特定鍵組合 $event 在 angular 模板中，當事件被觸發時，會傳遞一個 物件給事件處理器。 是 angular 模板語法中的特殊變數，常使用的用法如下： 代表事件物件本身，透過這個物件，可以取得事件相關的資訊。 代表自訂事件傳遞的資料內容，後續文章中會介紹相關用法。 防止事件預設行為 在某些情況下，可能需要防止事件的預設行為，例如點擊連結時不跳轉頁面，可以使用 來達成。 專案製作 今日目標：練習繫結用法，將 header 的 icon ，改成 img 標籤。 建立 logo.svg 定義路徑 使用繫結綁定圖片路徑 day 8 分享 結論 今天介紹了 angular 的事件監聽，現在已經知道如何讓使用者可以與應用程式互動。接下來，下一篇將認識 angular 的近年來的關鍵更新 signal，了解它如何改變開發 angular 應用的方式。"},{"title":"資料繫結 | Angular 新手練功日誌","titleLower":"資料繫結 | angular 新手練功日誌","url":"/blog/angular-training/data-binding/","urlLower":"/blog/angular-training/data-binding/","excerpt":"說明 Angular 的 Property Binding、Attribute Binding、Class Binding 與 Style Binding 用法。","searchText":"資料繫結 | angular 新手練功日誌 說明 angular 的 property binding、attribute binding、class binding 與 style binding 用法。 angular-training angular angular-training data-binding template-syntax 上一篇文章，我們介紹了動態處理資料的字串插值，這篇會介紹另一個重要技術：binding 繫結 binding 透過在屬性值周圍加上 來綁定屬性值，動態更新資料。 繫結的值可以是變數、表達式或函式呼叫。 屬性繫結 property binding 直接綁定到 dom 元素的屬性（property），例如： 會根據變數值動態更新 dom 屬性，會直接影響 dom 物件的行為，推薦用於互動性元件。 屬性值繫結 attribute binding 只會設定或移除 html 屬性，不會動態更新 dom 屬性。 只影響 html 標籤本身，通常用於自訂屬性或特殊情境，像是無障礙屬性（aria）。 綁定和字串插值搭配運用 若運用情境單純，也可以在屬性中使用字串插值，angular 會自動處理，將賦值視為 property binding。 綁定原生 html 屬性時，需要在 屬性名稱前加上 ，來區別是綁定 html 屬性還是 dom 屬性。 發方式呢？ 最主要是關注點分離 的概念，在剛開始建立專案時，可能只有一個頁面或功能，其實不太會感覺到元件化的好處，但隨著應用程式越來越複雜，若將所有的程式碼都寫在一起，會變得難以維護和擴展。 透過元件化，將 ui 切割成多個元件，讓每個元件只關注一個特定的功能或任務，可以提高元件的可重用性和可維護性。此外，angular 會將所有元件組成一棵「元件樹」，每個元件都是樹上的一個節點，彼此之間可以清楚地分工與協作。 angular 元件介紹 有別於其他框架是 sfc (single file component) 單一檔案元件，像是 vue 會有 .vue 檔案，react 會有 .jsx 或 .tsx 檔案，angular 採用的是多檔案元件的方式來組成一個元件 (component)。 每個元件通常包含以下檔案： ：元件的 typescript 檔案，包含元件的邏輯和行為。 ：元件的 html 模板檔案，定義元件的視覺結構。 或 ：元件的樣式檔案，用於定義元件的外觀。 ：測試檔案，用於單元測試。 檔案命名慣例 angular 20 版本前的元件檔案命名規則，慣例會用 來命名。 angular 20 版本後的元件檔案命名規則，則會省略 ，直接使用 。 接下來以 app.ts 為範例，來了解元件的基本結構，會有 裝飾器 (decorator) 和元件類別 (class)，這兩個關鍵核心。 @component 是一個 typescript 裝飾器 (decorator)，用來定義一個 angular 元件。它接受一個物件作為參數，這個物件包含了元件的各種設定和屬性。會在編譯成 javascript 時，將這些設定應用到元件類別上。 而這個裝飾器中必備的屬性有 和 。 是 angular 元件的核心屬性之一，用於定義元件在 html 中的標籤名稱。 它告訴 angular 如何在模板中識別和使用這個元件。 例如，若 設定為 ，則可以在 html 中使用 來引入這個元件。 除了預設的元素選擇器 命名外，可以使用自訂的選擇器名稱。 例如： class 選擇器、屬性選擇器等 、 定義元件的 html 模板。 它可以是內聯模板（inline template）或外部模板檔案。 外部模板檔案：透過 引用模板檔案路徑，會在檔案內部會放入元件的結構和內容， 內聯模板：直接在組件裝飾器中定義 屬性，使用反引號包裹多行 html。 定義元件的樣式 外部樣式檔案： 是用來指定元件的 css 樣式檔案路徑。 屬性可以接受一個字串陣列，包含多個樣式檔案。 內聯樣式：也支援內聯樣式，可以直接在元件中定義樣式。 多數情況下，都不會將模板、樣式直接寫在組件中，除非是非常簡單的元件。 屬性是用來引入其他 angular 模組或元件，以便在當前元件中使用它們的功能。 這個屬性接受一個陣列，包含要引入的模組或元件。 只有在 中引入的模組或元件，才能在當前元件的模板中使用。 class class 主要用來定義元件的邏輯和行為，是 javascript 的類別，使用方式基本上非常相似，像是可以使用 protected 和 private 等修飾詞來用來控制屬性或方法的存取範圍。之後會再詳細介紹在 angular 中元件類別的各種用法與技巧。 獨立元件 standalone components 目前 angular 支援兩種元件開發方式：基於模組的元件和獨立元件，而獨立元件是目前官方推薦的方式。 獨立元件是指不需要依賴模組 (module) 來註冊和使用的元件。 在各元件中使用 屬性來引入所需的模組或其他元件。 可以非常直觀地看到這個元件所依賴的模組和元件。 而要建立獨立元件需要使用 angular 14 引入的一個新功能 ，可以在裝飾器中，設定 屬性來定義是否是一個獨立元件。 取決於版本，在 angular 19 的發布後，預設就是 ，不需要再特別設定，在之前的版本中需要加入這個設定。 快速建立元件 使用 angular cli 可以快速建立元件，並自動生成相關的檔案和程式碼。 使用 ( ) 建立元件。 可以指定元件的名稱和資料夾結構。 若是在建立元件時不想自動生成測試檔案，可以在指令中加上 參數。 或是到 angular.json 中的 schematics 加上這段設定，可以讓你在使用 angular cli 快速生成指令時，自動套用 專案實作 這系列文章預計會實作專案，會在每個章節中，搭配當前學習到的內容，來陸續完成專案。 參考設計稿是 todo list 👅 figma，樣式部分之後會提供個人版本給大家參考，讓大家可以專注在 angular 的學習上。 專案實作部分會提供個人思路，不會詳細寫出每個步驟，方便大家練習和思考，也會提供完整程式碼參考，讓大家可以對照   const BACKLINK_NAV_KEY = 'backlink-nav'

  const normalizePath = (value) => {
    if (!value) return undefined
    return value.endsWith('/') ? value : `${value}/`
  }

  const isNavigableListPage = (pathname) => {
    return (
      pathname === '/blog/' ||
      /^\/series\/[^/]+\/$/.test(pathname) ||
      /^\/tags\/[^/]+\/$/.test(pathname)
    )
  }

  const isBlogDetailPage = (pathname) => {
    return (
      /^\/blog\/[^/]+\/$/.test(pathname) ||
      /^\/blog\/[^/]+\/[^/]+\/$/.test(pathname)
    )
  }

  document.addEventListener('astro:page-load', () => {
    const backLink = document.getElementById('back-link')
    if (!(backLink instanceof HTMLAnchorElement)) return

    const currentPath = normalizePath(window.location.pathname)
    if (!currentPath) return
    const shouldUseSourceOverride = isBlogDetailPage(currentPath)

    const navStateRaw = shouldUseSourceOverride
      ? sessionStorage.getItem(BACKLINK_NAV_KEY)
      : null
    if (navStateRaw) {
      try {
        const navState = JSON.parse(navStateRaw)
        const targetPath = typeof navState?.to === 'string' ? navState.to : ''
        const sourcePath =

        if (
          targetPath === `${currentPath}${window.location.search}` &&
          sourcePath
        ) {
          const sourceUrl = new URL(sourcePath, window.location.origin)
          const sourceNormalizedPath = normalizePath(sourceUrl.pathname)

          if (
            sourceNormalizedPath &&
            isNavigableListPage(sourceNormalizedPath)
          ) {
            backLink.href = `${sourceNormalizedPath}${sourceUrl.search}`
            return
          }
        }
      } catch {
        // ignore malformed session state and fall back to the default href
      }
    }

    const referrer = document.referrer
    if (!shouldUseSourceOverride) return
    if (!referrer) return

    try {
      const referrerUrl = new URL(referrer)
      if (referrerUrl.origin !== window.location.origin) return

      const referrerPath = normalizePath(referrerUrl.pathname)

      if (!currentPath || !referrerPath || currentPath === referrerPath) return
      if (!isNavigableListPage(referrerPath)) return

      const hasSearch = referrerUrl.search && referrerUrl.search.length > 0
      backLink.href = `${referrerPath}${hasSearch ? referrerUrl.search : ''}`
    } catch {
      return
    }
  })
